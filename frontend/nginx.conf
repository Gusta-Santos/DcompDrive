# Serve a interface e encaminha o PLANO DE CONTROLE (/api) ao controlador.
# Os blocos de dados NÃO passam por aqui: o navegador fala direto com os nós.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://controller:8000;
        proxy_set_header Host $host;
    }
    location /metrics {
        proxy_pass http://controller:8000;
    }
    location / {
        try_files $uri /index.html;
    }
}
